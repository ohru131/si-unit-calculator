name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # react-native-css-interopは初回ビルド時にnode_modules内へCSSキャッシュファイルを
      # 生成しながら同じバンドル処理内でそれを参照するため、真新しいチェックアウトでは
      # Metroのファイルクロールがこのファイルの生成に間に合わず
      # "Failed to get the SHA-1" で失敗することがある。空ファイルを先に用意しておくことで
      # クロール時点で存在させ、この競合を回避する。
      - name: Pre-create nativewind CSS cache file
        run: mkdir -p node_modules/react-native-css-interop/.cache && touch node_modules/react-native-css-interop/.cache/web.css

      - name: Export static web build
        env:
          GITHUB_PAGES_BASE_PATH: /${{ github.event.repository.name }}
        run: npx expo export -p web

      - name: Disable Jekyll processing
        run: touch dist/.nojekyll

      - name: Add SPA fallback for client-side routes
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
